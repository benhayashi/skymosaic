[project]
name = "skymosaic"
version = "1.0.0"
description = "Multi-Camera AllSky & Celestial Stargazer Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "imageio[ffmpeg]>=2.34.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.7.0",
    "pytz>=2024.1",
    "scipy>=1.10.0",
    "sgp4>=2.23",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
skymosaic = "main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

